<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Rakshak AI Responder</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">R</span><div><strong>Rakshak AI</strong><small>Responder Console</small></div></div><div class="top-actions"><span id="status" class="system-pill"><i></i> CONNECTING</span><a class="ghost-btn" href="command-center.html">Command Center</a></div></header><main class="cc"><div class="cc-head"><div><span class="section-kicker">FIELD RESPONSE</span><h1>Responder live console</h1><p>Assigned incidents, navigation and secure location telemetry.</p></div></div><div class="cc-grid"><section class="map-card"><div class="map-toolbar"><b>Responder location</b><span id="coords">GPS waiting</span></div><div id="responderMap" style="height:560px"></div></section><aside class="incidents-card"><div class="list-head"><div><b>Open incidents</b><span id="count">0</span></div></div><div id="queue" class="incident-list"></div></aside></div><section class="detail-card"><div class="detail-grid"><div><span class="section-kicker">RESPONDER</span><h2 id="unit">Unit R-01</h2><p id="assignment">Select an incident to receive an assignment.</p></div><div class="operator-actions"><button onclick="claim()">Claim selected</button><button onclick="arrived()">Mark arrived</button><button onclick="resolve()">Resolve</button><button onclick="sendLocation()">Send GPS now</button></div></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API=(window.RAKSHAK_API||localStorage.getItem('rakshak_api')||'').replace(/\/$/,'');let data=[],selected=null,map,me;const $=id=>document.getElementById(id);function init(){map=L.map('responderMap').setView([20.011,73.79],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}function render(){ $('count').textContent=data.length+' open';$('queue').innerHTML=data.map(x=>`<button class="cc-item ${selected?.id===x.id?'selected':''}" onclick="select('${x.id}')"><i class="qdot ${x.priority==='CRITICAL'?'red':x.priority==='HIGH'?'orange':'yellow'}"></i><span><b>${x.type}</b><small>${x.id} • ${x.status}</small></span><strong>${x.priority}</strong></button>`).join('')||'<div class="detail-empty">No open incidents.</div>'}function select(id){selected=data.find(x=>x.id===id);if(selected){$('assignment').textContent=`${selected.type} • ${selected.id} • ${selected.priority}`;if(selected.latitude&&selected.longitude)map.setView([selected.latitude,selected.longitude],16)}}async function load(){if(!API){$('status').textContent='API URL REQUIRED';return}const r=await fetch(API+'/api/incidents?active_only=true');if(r.ok){data=await r.json();render();$('status').innerHTML='<i></i> API ONLINE'}}async function action(status){if(!selected)return alert('Select an incident first');const r=await fetch(API+'/api/incidents/'+selected.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','X-Role':'responder'},body:JSON.stringify({status})});if(r.ok){selected=await r.json();load()}}function claim(){action('ACKNOWLEDGED')}function arrived(){action('ON_SCENE')}function resolve(){action('RESOLVED')}async function sendLocation(){if(!navigator.geolocation||!selected)return;navigator.geolocation.getCurrentPosition(async p=>{await fetch(API+'/api/incidents/'+selected.id+'/location',{method:'POST',headers:{'Content-Type':'application/json','X-Role':'responder'},body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})});$('coords').textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} ±${Math.round(p.coords.accuracy)}m`})}function track(){if(!navigator.geolocation)return;navigator.geolocation.watchPosition(p=>{$('coords').textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} ±${Math.round(p.coords.accuracy)}m`;if(me)me.setLatLng([p.coords.latitude,p.coords.longitude]);else{me=L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:9}).addTo(map).bindPopup('Responder R-01');}},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000})}init();load();track();setInterval(load,10000);</script></body></html>
