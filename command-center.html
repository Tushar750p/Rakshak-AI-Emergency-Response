<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rakshak AI Command Center</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">R</span><div><strong>Rakshak AI</strong><small>Operator Command Center</small></div></div><div class="top-actions"><span class="system-pill"><i></i> REAL-TIME API</span><a class="ghost-btn" href="index.html">Public Reporter</a></div></header><main class="cc"><div class="cc-head"><div><span class="section-kicker">OPERATIONS</span><h1>Live incident command</h1><p>Select an incident to inspect location, evidence and workflow state.</p></div><span id="connection" class="live-badge"><i></i> CONNECTING</span></div><div class="cc-grid"><section class="map-card"><div class="map-toolbar"><b>Live map</b><span id="mapInfo">Waiting for incidents</span></div><div id="operatorMap"></div></section><aside class="incidents-card"><div class="list-head"><div><b>Incident queue</b><span id="queueCount">0 reports</span></div></div><div id="incidentList" class="incident-list"></div></aside></div><section class="detail-card" id="detail"><div class="detail-empty">Select an incident from the queue.</div></section></main><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API=(window.RAKSHAK_API||localStorage.getItem('rakshak_api')||'').replace(/\/$/,'');let data=[],selected=null,map,markers=new Map();const $=id=>document.getElementById(id);const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)};const pc=p=>p==='CRITICAL'?'red':p==='HIGH'?'orange':'yellow';function initMap(){map=L.map('operatorMap').setView([20.011,73.79],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}function render(){const q=$('incidentList');$('queueCount').textContent=data.length+' reports';q.innerHTML=data.length?data.map(x=>`<button class="cc-item ${selected?.id===x.id?'selected':''}" data-id="${x.id}"><i class="qdot ${pc(x.priority)}"></i><span><b>${x.type}</b><small>${x.id} • ${x.status}</small></span><strong>${x.priority}</strong></button>`).join(''):'<div class="detail-empty">No incidents in API.</div>';q.querySelectorAll('.cc-item').forEach(b=>b.onclick=()=>select(b.dataset.id));markers.forEach(m=>map.removeLayer(m));markers.clear();const located=data.filter(x=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));located.forEach(x=>{const m=L.circleMarker([x.latitude,x.longitude],{radius:x.priority==='CRITICAL'?10:7,weight:2}).addTo(map).bindPopup(`<b>${x.type}</b><br>${x.id}<br>${x.status}`);m.on('click',()=>select(x.id));markers.set(x.id,m)});if(located.length){const bounds=L.latLngBounds(located.map(x=>[x.latitude,x.longitude]));map.fitBounds(bounds.pad(.2),{maxZoom:15})}}async function load(){if(!API){$('connection').innerHTML='● API URL REQUIRED';return}try{const r=await fetch(API+'/api/incidents');if(!r.ok)throw Error();data=await r.json();$('connection').innerHTML='<i></i> API ONLINE';render()}catch(e){$('connection').innerHTML='● API OFFLINE';toast('Could not reach the emergency API.')}}async function select(id){selected=data.find(x=>x.id===id);render();if(!selected)return;const r=await fetch(API+'/api/incidents/'+id);if(r.ok)selected=await r.json();$('detail').innerHTML=`<div class="detail-grid"><div><span class="section-kicker">SELECTED INCIDENT</span><h2>${selected.type} <small>${selected.id}</small></h2><p>${selected.description||'No description provided.'}</p><div class="meta-row"><span>Status <b>${selected.status}</b></span><span>Priority <b>${selected.priority}</b></span><span>Created <b>${new Date(selected.created_at).toLocaleString()}</b></span></div></div><div class="operator-actions"><b>Operator workflow</b><button onclick="setStatus('ACKNOWLEDGED')">Acknowledge</button><button onclick="setStatus('DISPATCHED')">Mark dispatched</button><button onclick="setStatus('RESOLVED')">Resolve</button>${selected.evidence_name?`<a href="${API}/evidence/${encodeURIComponent(selected.evidence_name)}" target="_blank">Open evidence</a>`:'<span>No evidence uploaded</span>'}</div></div>`;if(selected.latitude&&selected.longitude)map.setView([selected.latitude,selected.longitude],16)}async function setStatus(status){if(!selected)return;const r=await fetch(API+'/api/incidents/'+selected.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)return toast('Status update failed');selected=await r.json();const i=data.findIndex(x=>x.id===selected.id);if(i>=0)data[i]=selected;render();select(selected.id);toast('Incident updated: '+status)}function connect(){if(!API)return;const ws=new WebSocket(API.replace(/^http/,'ws')+'/ws');ws.onopen=()=>{$('connection').innerHTML='<i></i> REAL-TIME CONNECTED'};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.incident){const i=data.findIndex(x=>x.id===m.incident.id);if(i>=0)data[i]=m.incident;else data.unshift(m.incident);render();toast('New incident: '+m.incident.id)}if(m.event==='location.updated'){const i=data.findIndex(x=>x.id===m.incident_id);if(i>=0){data[i].latitude=m.latitude;data[i].longitude=m.longitude;render()}}};ws.onclose=()=>setTimeout(connect,3000)}initMap();load();connect();setInterval(load,15000);</script></body></html>
